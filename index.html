<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design World — Explore New Ideas</title>
  <meta name="description" content="Design World landing hero with a rotatable 3D glass cuboid refracting a headline with chromatic dispersion.">
  <meta property="og:title" content="Design World — Explore New Ideas">
  <meta property="og:description" content="Design World landing hero with a rotatable 3D glass cuboid refracting a headline with chromatic dispersion.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --bg: #000;
      --fg: #fff;
      --pad-x: clamp(20px, 6.95vw, 120px);
    }
    html, body {
      height: 100%;
      background: #000;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
      min-height: 520px;
      overflow: hidden;
      background: #000;
    }
    #scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      touch-action: none;
    }
    #scene.dragging {
      cursor: grabbing;
    }
    .ui {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }
    .ui a, .ui button {
      pointer-events: auto;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* NAV */
    .nav {
      position: absolute;
      top: clamp(24px, 4.7vh, 40px);
      left: var(--pad-x);
      right: var(--pad-x);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      letter-spacing: -0.01em;
    }
    .logo-mark {
      width: 20px;
      height: 40px;
      background: #fff;
      border-radius: 0 20px 20px 0;
      display: inline-block;
    }
    .logo b {
      font-weight: 700;
    }
    .logo span {
      font-weight: 400;
    }
    .nav-links {
      display: flex;
      gap: clamp(20px, 4.1vw, 60px);
      list-style: none;
    }
    .nav-links a {
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      position: relative;
      cursor: pointer;
    }
    .nav-links a::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: -4px;
      height: 1px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: right;
      transition: transform .35s ease;
    }
    .nav-links a:hover::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    /* ARROWS (top-right, left of the dots column) */
    .arrows {
      position: absolute;
      top: 18.9%;
      left: 76.7%;
      display: flex;
      gap: 32px;
      transform: translate(-19px, -50%);
    }
    .arrow {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2.5px solid #fff;
      background: transparent;
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background .25s, color .25s;
      padding: 0;
      outline: none;
    }
    .arrow svg {
      width: 18px;
      height: 18px;
      display: block;
    }
    .arrow:hover {
      background: #fff;
      color: #000;
    }

    /* PAGINATION DOTS (vertical, right edge) */
    .dots {
      position: absolute;
      right: calc(var(--pad-x) - 7px);
      top: 49.4%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 33px;
    }
    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #fff;
      background: #fff;
      cursor: pointer;
      transition: background .25s;
      padding: 0;
      outline: none;
    }
    .dot.active {
      background: transparent;
    }

    /* TAGLINE (bottom-left) */
    .tagline {
      position: absolute;
      left: var(--pad-x);
      bottom: clamp(40px, 7.5vh, 70px);
      font-size: clamp(24px, 2.65vw, 44px);
      line-height: 1.2;
      font-weight: 300;
      letter-spacing: -0.01em;
    }
    .tagline strong {
      font-weight: 700;
      display: block;
    }

    /* CTA ROW (button -> horizontal line -> giant outlined "07" bleeding off right edge) */
    .cta-row {
      position: absolute;
      left: 45.6%;
      right: -1vw;
      top: 88.7%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
    }
    .cta {
      flex: none;
      padding: 0 15px;
      height: 48px;
      display: inline-flex;
      align-items: center;
      border: 1.5px solid rgba(255, 255, 255, .85);
      border-radius: 6px;
      background: rgba(0, 0, 0, .15);
      color: #fff;
      font-size: 14px;
      font-weight: 400;
      text-decoration: none;
      cursor: pointer;
      transition: background .25s, color .25s;
    }
    .cta:hover {
      background: #fff;
      color: #000;
    }
    .cta-line {
      flex: 1;
      height: 1.5px;
      background: rgba(255, 255, 255, .8);
      min-width: 40px;
    }
    .count {
      flex: none;
      font-size: clamp(140px, 19.8vw, 360px);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.02em;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(255, 255, 255, .9);
      transform: translateY(6%);
      user-select: none;
    }

    /* LOADER */
    .loader {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 12px;
      letter-spacing: .2em;
      text-transform: uppercase;
      opacity: .6;
      transition: opacity .6s;
      pointer-events: none;
    }
    .loader.done {
      opacity: 0;
    }

    /* RESPONSIVE */
    @media (max-width: 900px), (max-aspect-ratio: 1/1) {
      .arrows {
        left: auto;
        right: var(--pad-x);
        top: 15%;
        transform: translateY(-50%);
        gap: 14px;
      }
      .tagline {
        bottom: clamp(150px, 20vh, 220px);
      }
      .cta-row {
        left: var(--pad-x);
        right: -3vw;
        top: auto;
        bottom: 24px;
        transform: none;
      }
      .count {
        font-size: clamp(120px, 22vw, 200px);
      }
    }
    @media (max-width: 640px) {
      .nav-links {
        gap: 16px;
      }
      .nav-links a, .logo {
        font-size: 13px;
      }
      .dots {
        gap: 20px;
        right: 16px;
      }
      .dot {
        width: 10px;
        height: 10px;
      }
      .cta-row {
        right: -8vw;
      }
      .count {
        font-size: 120px;
      }
    }
    @media (max-width: 420px) {
      .nav-links li:nth-child(2) {
        display: none;
      }
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <section class="hero" id="hero">
    <canvas id="scene" aria-label="Rotatable glass cube. Drag to rotate."></canvas>
    <div class="ui">
      <h1 class="sr-only">Explore New Ideas</h1>
      <header class="nav">
        <a href="#" class="logo"><i class="logo-mark"></i><b>Design</b><span>World</span></a>
        <ul class="nav-links">
          <li><a href="#">Home</a></li>
          <li><a href="#">Portfolio</a></li>
          <li><a href="#">Contact Us</a></li>
        </ul>
      </header>
      <div class="arrows">
        <button class="arrow" id="prev" aria-label="Previous">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M11 6l-6 6 6 6"/>
          </svg>
        </button>
        <button class="arrow" id="next" aria-label="Next">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M13 6l6 6-6 6"/>
          </svg>
        </button>
      </div>
      <nav class="dots">
        <button class="dot" aria-label="Slide 1"></button>
        <button class="dot active" aria-label="Slide 2"></button>
        <button class="dot" aria-label="Slide 3"></button>
      </nav>
      <p class="tagline">Let's Build the<br>Future of <strong>Design.</strong></p>
      <div class="cta-row">
        <a href="#" class="cta">Explore Now</a>
        <span class="cta-line"></span>
        <span class="count" aria-hidden="true">07</span>
      </div>
      <div class="loader" id="loader">Loading model</div>
    </div>
  </section>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { mergeVertices, mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    // 1. Scene, Renderer, Camera
    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: false,
    });
    renderer.setClearColor(0x000000, 1);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

    const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 10);
    camera.lookAt(0, 0, 0);

    const scene = new THREE.Scene();
    const bgScene = new THREE.Scene();

    const pivot = new THREE.Group();
    scene.add(pivot);

    const spinner = new THREE.Group();
    spinner.quaternion.setFromEuler(new THREE.Euler(-0.42, 0.62, 0.18, 'XYZ'));
    pivot.add(spinner);

    // 2. Offscreen 2D Canvas for background headline
    const bgCanvas = document.createElement('canvas');
    const bgCtx = bgCanvas.getContext('2d');
    const bgTexture = new THREE.CanvasTexture(bgCanvas);
    bgTexture.colorSpace = THREE.SRGBColorSpace;
    bgTexture.minFilter = THREE.LinearFilter;
    bgTexture.magFilter = THREE.LinearFilter;
    bgTexture.generateMipmaps = false;

    // Fullscreen quad for background
    const bgQuadGeo = new THREE.PlaneGeometry(2, 2);
    const bgQuadMat = new THREE.ShaderMaterial({
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D uTex;
        varying vec2 vUv;
        void main() {
          gl_FragColor = texture2D(uTex, vUv);
#include <colorspace_fragment>
        }
      `,
      uniforms: {
        uTex: { value: bgTexture }
      },
      depthTest: false,
      depthWrite: false,
    });
    const bgQuad = new THREE.Mesh(bgQuadGeo, bgQuadMat);
    bgQuad.frustumCulled = false;
    bgScene.add(bgQuad);

    // 3. Render Targets for two-pass glass refraction
    let drawW = Math.max(1, Math.floor(window.innerWidth * Math.min(window.devicePixelRatio || 1, 2)));
    let drawH = Math.max(1, Math.floor(window.innerHeight * Math.min(window.devicePixelRatio || 1, 2)));

    const rtBack = new THREE.WebGLRenderTarget(drawW, drawH, {
      type: THREE.HalfFloatType,
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      generateMipmaps: false,
    });

    const rtFront = new THREE.WebGLRenderTarget(drawW, drawH, {
      type: THREE.HalfFloatType,
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      generateMipmaps: false,
    });

    // 4. Glass Shader Materials
    const glassVertexShader = `
      varying vec3 vNormal;
      varying vec3 vEye;

      void main() {
        vec4 worldPos = modelMatrix * vec4(position, 1.0);
        vec4 mvPos = viewMatrix * worldPos;
        gl_Position = projectionMatrix * mvPos;
        vNormal = normalize(normalMatrix * normal);
        vEye = normalize(mvPos.xyz);
      }
    `;

    const glassFragmentShader = `
      uniform sampler2D uTexture;
      uniform vec2 uResolution;
      uniform float uIorR;
      uniform float uIorY;
      uniform float uIorG;
      uniform float uIorC;
      uniform float uIorB;
      uniform float uIorP;
      uniform float uRefractPower;
      uniform float uChromatic;
      uniform float uSaturation;
      uniform float uShininess;
      uniform float uDiffuseness;
      uniform float uFresnelPower;
      uniform vec3 uLight;
      uniform float uBackside;

      varying vec3 vNormal;
      varying vec3 vEye;

      float calcSpecular(vec3 lightDir, float shininess, float diffuseness, vec3 n, vec3 eye) {
        vec3 lightVec = normalize(-lightDir);
        vec3 view = -eye;
        vec3 halfVec = normalize(lightVec + view);
        return pow(max(dot(n, halfVec), 0.0), shininess) + max(0.0, dot(n, lightVec)) * diffuseness;
      }

      void main() {
        vec2 uv = gl_FragCoord.xy / uResolution;
        vec3 n = normalize(vNormal);
        if (uBackside > 0.5) n = -n;
        vec3 eye = normalize(vEye);

        const int LOOP = 16;
        vec3 accumColor = vec3(0.0);

        vec3 refrR = refract(eye, n, 1.0 / uIorR);
        vec3 refrY = refract(eye, n, 1.0 / uIorY);
        vec3 refrG = refract(eye, n, 1.0 / uIorG);
        vec3 refrC = refract(eye, n, 1.0 / uIorC);
        vec3 refrB = refract(eye, n, 1.0 / uIorB);
        vec3 refrP = refract(eye, n, 1.0 / uIorP);

        for (int i = 0; i < LOOP; i++) {
          float slide = float(i) / float(LOOP) * 0.045;

          vec2 offR = refrR.xy * (uRefractPower + slide * 1.0) * uChromatic;
          vec2 offY = refrY.xy * (uRefractPower + slide * 1.0) * uChromatic;
          vec2 offG = refrG.xy * (uRefractPower + slide * 2.0) * uChromatic;
          vec2 offC = refrC.xy * (uRefractPower + slide * 2.5) * uChromatic;
          vec2 offB = refrB.xy * (uRefractPower + slide * 3.0) * uChromatic;
          vec2 offP = refrP.xy * (uRefractPower + slide * 1.0) * uChromatic;

          vec3 sR = texture2D(uTexture, uv + offR).rgb;
          vec3 sY = texture2D(uTexture, uv + offY).rgb;
          vec3 sG = texture2D(uTexture, uv + offG).rgb;
          vec3 sC = texture2D(uTexture, uv + offC).rgb;
          vec3 sB = texture2D(uTexture, uv + offB).rgb;
          vec3 sP = texture2D(uTexture, uv + offP).rgb;

          float r = sR.r * 0.5;
          float y = (sY.r * 2.0 + sY.g * 2.0 - sY.b) / 6.0;
          float g = sG.g * 0.5;
          float c = (sC.g * 2.0 + sC.b * 2.0 - sC.r) / 6.0;
          float b = sB.b * 0.5;
          float p = (sP.b * 2.0 + sP.r * 2.0 - sP.g) / 6.0;

          float R = r + (2.0 * p + 2.0 * y - c) / 3.0;
          float G = g + (2.0 * y + 2.0 * c - p) / 3.0;
          float B = b + (2.0 * c + 2.0 * p - y) / 3.0;

          accumColor += vec3(R, G, B);
        }

        vec3 color = accumColor / float(LOOP);

        // Saturation adjustment
        float luma = dot(color, vec3(0.2125, 0.7154, 0.0721));
        color = mix(vec3(luma), color, uSaturation);

        // Specular (Blinn-Phong)
        bool backside = (uBackside > 0.5);
        float spec = calcSpecular(uLight, uShininess, uDiffuseness, n, eye) +
                     0.6 * calcSpecular(vec3(1.0, 1.0, -1.0), uShininess * 0.6, uDiffuseness * 0.5, n, eye);
        color += spec * (backside ? 0.35 : 1.0);

        // Fresnel
        float f = pow(clamp(1.0 + dot(eye, n), 0.0, 1.0), uFresnelPower);
        color = mix(color, vec3(1.0), f * (backside ? 0.25 : 0.55));

        color += vec3(0.004, 0.005, 0.007);
        gl_FragColor = vec4(color, 1.0);
#include <colorspace_fragment>
      }
    `;

    const uniformsBack = {
      uTexture: { value: rtBack.texture },
      uResolution: { value: new THREE.Vector2(drawW, drawH) },
      uIorR: { value: 1.15 },
      uIorY: { value: 1.16 },
      uIorG: { value: 1.18 },
      uIorC: { value: 1.22 },
      uIorB: { value: 1.22 },
      uIorP: { value: 1.22 },
      uRefractPower: { value: 0.22 },
      uChromatic: { value: 0.5 },
      uSaturation: { value: 1.08 },
      uShininess: { value: 90.0 },
      uDiffuseness: { value: 0.02 },
      uFresnelPower: { value: 5.0 },
      uLight: { value: new THREE.Vector3(-1.0, 1.0, 1.0) },
      uBackside: { value: 1.0 },
    };

    const uniformsFront = {
      uTexture: { value: rtFront.texture },
      uResolution: { value: new THREE.Vector2(drawW, drawH) },
      uIorR: { value: 1.15 },
      uIorY: { value: 1.16 },
      uIorG: { value: 1.18 },
      uIorC: { value: 1.22 },
      uIorB: { value: 1.22 },
      uIorP: { value: 1.22 },
      uRefractPower: { value: 0.30 },
      uChromatic: { value: 0.5 },
      uSaturation: { value: 1.08 },
      uShininess: { value: 90.0 },
      uDiffuseness: { value: 0.02 },
      uFresnelPower: { value: 5.0 },
      uLight: { value: new THREE.Vector3(-1.0, 1.0, 1.0) },
      uBackside: { value: 0.0 },
    };

    const backMat = new THREE.ShaderMaterial({
      vertexShader: glassVertexShader,
      fragmentShader: glassFragmentShader,
      uniforms: uniformsBack,
      side: THREE.BackSide,
      transparent: false,
    });

    const frontMat = new THREE.ShaderMaterial({
      vertexShader: glassVertexShader,
      fragmentShader: glassFragmentShader,
      uniforms: uniformsFront,
      side: THREE.FrontSide,
      transparent: false,
    });

    // Initial placeholder mesh
    const defaultGeo = new RoundedBoxGeometry(1, 1, 1, 8, 0.12);
    defaultGeo.computeBoundingBox();
    const cubeMesh = new THREE.Mesh(defaultGeo, frontMat);
    spinner.add(cubeMesh);

    // 5. Model Loading
    function applyGeometry(geo) {
      geo.computeBoundingBox();
      const box = geo.boundingBox;
      const center = new THREE.Vector3();
      box.getCenter(center);
      geo.translate(-center.x, -center.y, -center.z);
      const size = new THREE.Vector3();
      box.getSize(size);
      const maxDim = Math.max(size.x, size.y, size.z);
      if (maxDim > 0) {
        geo.scale(1 / maxDim, 1 / maxDim, 1 / maxDim);
      }
      cubeMesh.geometry.dispose();
      cubeMesh.geometry = geo;
      document.getElementById('loader')?.classList.add('done');
    }

    const MODEL_URL = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260929_212926_92423081-b0e4-4f5a-b650-14af6c05c058.glb';
    const gltfLoader = new GLTFLoader();
    gltfLoader.load(
      MODEL_URL,
      (gltf) => {
        try {
          const geometries = [];
          gltf.scene.updateMatrixWorld(true);
          gltf.scene.traverse((child) => {
            if (child.isMesh && child.geometry) {
              const g = child.geometry.clone();
              if (g.attributes.uv) g.deleteAttribute('uv');
              if (g.attributes.color) g.deleteAttribute('color');
              if (g.attributes.tangent) g.deleteAttribute('tangent');
              const merged = mergeVertices(g, 1e-4);
              merged.computeVertexNormals();
              merged.applyMatrix4(child.matrixWorld);
              geometries.push(merged);
            }
          });
          if (geometries.length > 0) {
            const finalGeo = mergeGeometries(geometries);
            if (finalGeo) {
              applyGeometry(finalGeo);
              return;
            }
          }
          applyGeometry(new RoundedBoxGeometry(1, 1, 1, 8, 0.12));
        } catch (err) {
          console.warn('Model processing error, using fallback:', err);
          applyGeometry(new RoundedBoxGeometry(1, 1, 1, 8, 0.12));
        }
      },
      undefined,
      (err) => {
        console.warn('Model load failed, using fallback:', err);
        applyGeometry(new RoundedBoxGeometry(1, 1, 1, 8, 0.12));
      }
    );

    // 6. Background Headline 2D Canvas rendering
    function drawHeadlineCanvas() {
      const W = window.innerWidth;
      const H = window.innerHeight;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      const targetW = Math.max(1, Math.round(W * dpr));
      const targetH = Math.max(1, Math.round(H * dpr));

      if (bgCanvas.width !== targetW || bgCanvas.height !== targetH) {
        bgCanvas.width = targetW;
        bgCanvas.height = targetH;
      }

      bgCtx.save();
      bgCtx.scale(dpr, dpr);

      bgCtx.fillStyle = '#000000';
      bgCtx.fillRect(0, 0, W, H);

      const mobile = (W < 768) || (W / H < 1);
      let fs = Math.min(H * 0.21, W * (mobile ? 0.21 : 0.118));
      bgCtx.font = `800 ${fs}px Poppins, sans-serif`;

      const lines = ['Explore', 'New', 'Ideas'];
      let maxLineWidth = 0;
      for (const line of lines) {
        const m = bgCtx.measureText(line).width;
        if (m > maxLineWidth) maxLineWidth = m;
      }

      const maxAllowed = W * (mobile ? 0.9 : 0.5);
      if (maxLineWidth > maxAllowed && maxLineWidth > 0) {
        fs = fs * (maxAllowed / maxLineWidth);
        bgCtx.font = `800 ${fs}px Poppins, sans-serif`;
      }

      bgCtx.fillStyle = '#e9e9e9';
      bgCtx.textAlign = 'center';
      bgCtx.textBaseline = 'alphabetic';

      const cx = W * (mobile ? 0.5 : 0.505);
      const cy = H * (mobile ? 0.45 : 0.468);
      const gap = fs * 1.07;
      const cap = fs * 0.7;

      lines.forEach((line, i) => {
        const y = cy + cap / 2 + (i - 1) * gap;
        bgCtx.fillText(line, cx, y);
      });

      bgCtx.restore();

      bgTexture.needsUpdate = true;
    }

    // 7. Layout & Resize
    function layout() {
      const W = window.innerWidth;
      const H = window.innerHeight;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      renderer.setSize(W, H, false);
      renderer.setPixelRatio(dpr);

      camera.aspect = W / H;
      camera.updateProjectionMatrix();

      const newDrawW = Math.max(1, Math.floor(W * dpr));
      const newDrawH = Math.max(1, Math.floor(H * dpr));

      rtBack.setSize(newDrawW, newDrawH);
      rtFront.setSize(newDrawW, newDrawH);

      uniformsBack.uResolution.value.set(newDrawW, newDrawH);
      uniformsFront.uResolution.value.set(newDrawW, newDrawH);

      drawHeadlineCanvas();

      // Cube placement
      const mobile = (W < 768) || (W / H < 1);
      const fovRad = (camera.fov * Math.PI) / 180;
      const visH = 2 * Math.tan(fovRad / 2) * 10;
      const visW = visH * camera.aspect;

      const sx = mobile ? 0.5 : 0.517;
      const sy = mobile ? 0.45 : 0.488;
      pivot.position.set((sx - 0.5) * visW, (0.5 - sy) * visH, 0);

      const px = Math.min(H * 0.44, W * (mobile ? 0.45 : 0.29));
      const scale = (px / H) * visH;
      pivot.scale.set(scale, scale, scale);
    }

    // 8. Render Pipeline
    function render() {
      // 1) Render bgScene to rtBack
      renderer.setRenderTarget(rtBack);
      renderer.clear();
      renderer.render(bgScene, camera);

      // 2) Render bgScene to rtFront, then cube with backMat to rtFront
      renderer.setRenderTarget(rtFront);
      renderer.clear();
      renderer.render(bgScene, camera);

      cubeMesh.material = backMat;
      renderer.autoClear = false;
      renderer.render(scene, camera);

      // 3) Render bgScene to screen, then cube with frontMat to screen
      renderer.setRenderTarget(null);
      renderer.clear();
      renderer.render(bgScene, camera);

      renderer.clearDepth();
      cubeMesh.material = frontMat;
      renderer.render(scene, camera);
      renderer.autoClear = true;
    }

    // 9. Interaction & Animation State
    let isPointerDown = false;
    let isDragging = false;
    let startX = 0, startY = 0;
    let lastX = 0, lastY = 0;
    let velX = 0, velY = 0;
    let lastMoveTime = performance.now();
    let spinRemainingY = 0;
    let timeSinceRelease = 100; // start >= 1.6s so idle drift starts immediately
    let idleBlend = 1.0;

    canvas.addEventListener('pointerdown', (e) => {
      canvas.setPointerCapture(e.pointerId);
      isPointerDown = true;
      isDragging = false;
      startX = e.clientX;
      startY = e.clientY;
      lastX = e.clientX;
      lastY = e.clientY;
      velX = 0;
      velY = 0;
      spinRemainingY = 0;
      idleBlend = 0;
      lastMoveTime = performance.now();
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isPointerDown) return;
      const dist = Math.hypot(e.clientX - startX, e.clientY - startY);
      if (dist > 3 && !isDragging) {
        isDragging = true;
        canvas.classList.add('dragging');
      }
      if (!isDragging) return;

      const now = performance.now();
      const dtMs = Math.max(now - lastMoveTime, 1);
      const deltaX = e.clientX - lastX;
      const deltaY = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;
      lastMoveTime = now;

      const dx = deltaX * 0.008;
      const dy = deltaY * 0.008;

      const qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), dx);
      const qX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), dy);
      spinner.quaternion.premultiply(qY);
      spinner.quaternion.premultiply(qX);

      const instantVelX = dx / (dtMs / 16.667);
      const instantVelY = dy / (dtMs / 16.667);
      velX = velX * 0.3 + instantVelX * 0.7;
      velY = velY * 0.3 + instantVelY * 0.7;
    });

    function endPointer(e) {
      if (!isPointerDown) return;
      try {
        if (canvas.hasPointerCapture(e.pointerId)) {
          canvas.releasePointerCapture(e.pointerId);
        }
      } catch (err) {}
      isPointerDown = false;
      isDragging = false;
      canvas.classList.remove('dragging');
      if (performance.now() - lastMoveTime > 80) {
        velX = 0;
        velY = 0;
      }
      timeSinceRelease = 0;
    }

    canvas.addEventListener('pointerup', endPointer);
    canvas.addEventListener('pointercancel', endPointer);

    // Prev / Next button handlers
    document.getElementById('prev').addEventListener('click', (e) => {
      e.preventDefault();
      spinRemainingY -= Math.PI / 2;
      velX = 0;
      velY = 0;
      timeSinceRelease = 0;
      idleBlend = 0;
    });

    document.getElementById('next').addEventListener('click', (e) => {
      e.preventDefault();
      spinRemainingY += Math.PI / 2;
      velX = 0;
      velY = 0;
      timeSinceRelease = 0;
      idleBlend = 0;
    });

    // Pagination dots
    document.querySelectorAll('.dot').forEach((dot) => {
      dot.addEventListener('click', () => {
        document.querySelectorAll('.dot').forEach((d) => d.classList.remove('active'));
        dot.classList.add('active');
      });
    });

    // 10. Main Animation Loop
    let lastFrameTime = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);

      let dt = (now - lastFrameTime) / 1000;
      lastFrameTime = now;

      // Clamp frame dt to 0.05s
      if (dt > 0.05) dt = 0.05;
      if (dt <= 0) dt = 0.016;

      const factor = dt * 60;

      // Smooth rotate for arrow buttons (-90 / +90 deg)
      if (Math.abs(spinRemainingY) > 0.00001) {
        const ease = Math.min(1.0, 0.09 * factor);
        const step = spinRemainingY * ease;
        spinRemainingY -= step;
        const qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), step);
        spinner.quaternion.premultiply(qY);
        if (Math.abs(spinRemainingY) < 0.0005) {
          const qFin = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), spinRemainingY);
          spinner.quaternion.premultiply(qFin);
          spinRemainingY = 0;
        }
      }

      // Inertia after release
      if (!isPointerDown && Math.abs(spinRemainingY) < 0.0001) {
        if (Math.abs(velX) > 0.00001 || Math.abs(velY) > 0.00001) {
          const qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), velX * factor);
          const qX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), velY * factor);
          spinner.quaternion.premultiply(qY);
          spinner.quaternion.premultiply(qX);

          const damp = Math.pow(0.94, factor);
          velX *= damp;
          velY *= damp;
          if (Math.abs(velX) < 1e-5) velX = 0;
          if (Math.abs(velY) < 1e-5) velY = 0;
        }

        // Idle drift: 0.6s after release, ramp 0->1 over 1s
        timeSinceRelease += dt;
        if (timeSinceRelease > 0.6) {
          idleBlend = Math.min(1.0, (timeSinceRelease - 0.6) / 1.0);
        } else {
          idleBlend = 0;
        }

        if (idleBlend > 0) {
          const idleY = 0.0035 * factor * idleBlend;
          const idleX = 0.0012 * factor * idleBlend;
          const qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), idleY);
          const qX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), idleX);
          spinner.quaternion.premultiply(qY);
          spinner.quaternion.premultiply(qX);
        }
      }

      render();
    }

    // 11. Initialisation: Wait for fonts then start
    const fontPromise = Promise.all([
      document.fonts ? document.fonts.load('800 100px Poppins') : Promise.resolve(),
      document.fonts ? document.fonts.ready : Promise.resolve()
    ]);
    const timeoutPromise = new Promise((resolve) => setTimeout(resolve, 2500));

    Promise.race([fontPromise, timeoutPromise]).then(() => {
      layout();
      lastFrameTime = performance.now();
      requestAnimationFrame(animate);
    });

    window.addEventListener('resize', layout);
    if (document.fonts) {
      document.fonts.addEventListener('loadingdone', () => {
        drawHeadlineCanvas();
      });
    }
  </script>
</body>
</html>
